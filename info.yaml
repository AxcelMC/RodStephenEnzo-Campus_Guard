# Tiny Tapeout project information

project:
  title: "Campus Sentinel 2.0"

  author: "Rod Geryk Navarro, Stephen Axcel Galletes, Lorenzo Dacanay"

  discord: ""

  description: "Verilog multi-hazard emergency detection, alarm latching, and evacuation routing controller"

  language: "Verilog"

  # Nominal clock frequency used for the project.
  clock_hz: 10

  # Campus Sentinel uses a small 2-bit FSM and combinational
  # decision/routing logic. Start with one tile.
  tiles: "1x1"

  # Top-level Verilog module.
  # This MUST exactly match the module name in src/project.v.
  top_module: "tt_um_AxcelMC_campus_sentinel"

  # RTL source files located inside ./src
  source_files:
    - "project.v"


# ================================================================
# PINOUT
# ================================================================
#
# Dedicated clock:
#
# clk = Campus Sentinel FSM clock
#
# Dedicated active-low reset:
#
# rst_n = Hardware reset
#
# ================================================================

pinout:

  # --------------------------------------------------------------
  # INPUTS
  # --------------------------------------------------------------

  ui[0]: "Smoke"
  ui[1]: "Motion"
  ui[2]: "Door"
  ui[3]: "Panic"
  ui[4]: "Reset"
  ui[5]: "Ack"
  ui[6]: ""
  ui[7]: ""


  # --------------------------------------------------------------
  # OUTPUTS
  # --------------------------------------------------------------

  uo[0]: "Safe"
  uo[1]: "Warning"
  uo[2]: "Critical"
  uo[3]: "Evacuate"
  uo[4]: "Buzzer"
  uo[5]: "RouteA"
  uo[6]: "RouteB"
  uo[7]: "RouteC"


  # --------------------------------------------------------------
  # BIDIRECTIONAL I/O
  # --------------------------------------------------------------
  #
  # Not used by Campus Sentinel 2.0.
  # --------------------------------------------------------------

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""


# Do not change!
yaml_version: 6
