project:
  title:        "Campus Sentinel 2.0"
  author:       "Rod Geryk Navarro, Stephen Axcel Galletes, Lorenzo Dacanay"
  discord:      ""
  description:  "Verilog multi-hazard emergency detection, alarm latching, and evacuation routing controller"
  language:     "Verilog"

  # The design uses the template's dedicated clk input.
  # Set this to the clock frequency you will verify the design at.
  # 10 Hz matches the clock used in the current Wokwi demonstration.
  clock_hz:     10

  # Start with the smallest tile allocation.
  # This design is relatively small: a 2-bit FSM plus combinational logic.
  tiles: "1x1"

  # IMPORTANT:
  # Replace YOUR_GITHUB_USERNAME with your actual GitHub username.
  # Tiny Tapeout requires the top module name to begin with tt_um_.
  top_module: "tt_um_YOUR_GITHUB_USERNAME_campus_sentinel"

  # RTL source file located inside ./src
  source_files:
    - "project.v"


# ============================================================
# PINOUT
# ============================================================
#
# Dedicated inputs:
#
# ui[0] = Smoke detector
# ui[1] = Motion detector
# ui[2] = Door/security detector
# ui[3] = Panic/emergency input
# ui[4] = System reset
# ui[5] = Alarm acknowledge
#
# ui[6] and ui[7] are currently reserved for future expansion.
#
# The FSM clock uses the dedicated Tiny Tapeout `clk` input,
# NOT one of the ui[] pins.
#
# Dedicated outputs:
#
# uo[0] = SAFE
# uo[1] = WARNING
# uo[2] = CRITICAL
# uo[3] = EVACUATE
# uo[4] = BUZZER
# uo[5] = EXIT A
# uo[6] = EXIT B
# uo[7] = EXIT C
#
# Bidirectional pins are currently unused.
# ============================================================

pinout:

  # ----------------------------------------------------------
  # INPUTS
  # ----------------------------------------------------------

  ui[0]: "Smoke"
  ui[1]: "Motion"
  ui[2]: "Door"
  ui[3]: "Panic"
  ui[4]: "Reset"
  ui[5]: "Ack"
  ui[6]: ""
  ui[7]: ""


  # ----------------------------------------------------------
  # OUTPUTS
  # ----------------------------------------------------------

  uo[0]: "Safe"
  uo[1]: "Warning"
  uo[2]: "Critical"
  uo[3]: "Evacuate"
  uo[4]: "Buzzer"
  uo[5]: "RouteA"
  uo[6]: "RouteB"
  uo[7]: "RouteC"


  # ----------------------------------------------------------
  # BIDIRECTIONAL PINS
  #
  # Campus Sentinel currently does not require bidirectional
  # I/O, so these pins remain unused.
  # ----------------------------------------------------------

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""


# Do not change!
yaml_version: 6
